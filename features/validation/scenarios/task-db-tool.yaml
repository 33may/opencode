id: task-db-tool
feature: task-db
story: Agent uses the August-local taskdb tool instead of Linear to create and inspect a task.
prompt: |
  Use the taskdb tool, not Linear and not shell, to create a task titled "Validate local task DB" in project "validation" with label "task-db".
  Then list tasks in project "validation" with label "task-db" and reply with the created task id and title.
expected:
  final_contains_any:
    - AUG-1
    - Validate local task DB
  messages_contain_any:
    - Validate local task DB
  tool_calls:
    - taskdb
judge:
  question: Did the assistant use taskdb to create and inspect the local task instead of relying on Linear?
